name: Tests

on:
  push:
    branches:
      - test

jobs:
  Test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      OTEL_SDK_DISABLED: "true"
      OTEL_PHP_DISABLED: "true"
      OTEL_TRACES_EXPORTER: "none"
      DB_CONNECTION: mongodb
      MONGODB_URI: "mongodb://127.0.0.1:27017/unused"
      MONGODB_DATABASE: "testing"

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: mbstring, intl, mongodb, rdkafka, opentelemetry
          coverage: xdebug
        env:
          fail-fast: true

      - name: Verify PHP extensions
        run: |
          php -v
          php -m | grep -E 'mongodb|opentelemetry|rdkafka'
          php --ri opentelemetry

      - name: Fix git ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Create Dummy Env File
        run: touch .env

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Inject JWT Keys from Secrets
        run: |
          mkdir -p keys
          echo "${{ secrets.JWT_PRIVATE_KEY }}" > keys/private.pem
          echo "${{ secrets.JWT_PUBLIC_KEY }}" > keys/public.pem
          chmod 600 keys/private.pem

      - name: Run test suite
        run: composer run-script test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          files: storage/logs/clover.xml
          fail_ci_if_error: true

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Create Pull Request
        if: ${{ success() }}
        uses: repo-sync/pull-request@7e79a9f5dc3ad0ce53138f01df2fad14a04831c5
        env:
          GITHUB_TOKEN: ${{ secrets.MYWORKFLOW }}
        with:
          source_branch: "test"
          destination_branch: "main"
          pr_title: ${{ github.event.head_commit.message }}
          pr_body: ${{ github.event.head_commit.message }}
          pr_label: "Staging,TestsPassed"
          pr_assignee: "damouu"
